[project]
name = "pythonproject1"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "crewai>=1.15.22",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "ai: live CrewAI analyst tests that require RUN_AI_TESTS=1",
]
